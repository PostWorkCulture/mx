<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MX</title>
<style>
  /* MX UI – black and white only. The scenery is the colour. */
  :root { --dim: rgba(255,255,255,0.55); --faint: rgba(255,255,255,0.24); --shadow: 0 1px 2px rgba(0,0,0,0.45), 0 0 22px rgba(0,0,0,0.3); --gut: max(28px, 6vw); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #fff; font: 400 14px/1.4 "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; user-select: none; }
  canvas { display: block; }
  .caps { text-transform: uppercase; letter-spacing: 0.24em; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; text-shadow: var(--shadow); opacity: 0; transition: opacity 0.4s; }
  #hud.on { opacity: 1; }
  #hud > div { position: absolute; }
  #time { top: 22px; left: 28px; font-weight: 300; font-size: 30px; font-variant-numeric: tabular-nums; letter-spacing: 0.03em; }
  #pos { top: 22px; right: 28px; font-weight: 300; font-size: 30px; }
  #pos small { font-size: 14px; color: var(--dim); margin-left: 3px; }
  #speed { bottom: 22px; right: 28px; text-align: right; font-weight: 300; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
  #speed small { display: block; margin-top: 4px; font-size: 10px; color: var(--dim); }
  #track { bottom: 32px; left: 50%; transform: translateX(-50%); width: min(44vw, 440px); height: 1px; background: var(--faint); box-shadow: 0 0 6px rgba(0,0,0,0.25); }
  #track .cp { position: absolute; top: -3px; width: 1px; height: 7px; background: var(--dim); }
  #track .fin { position: absolute; right: 0; top: -5px; width: 1px; height: 11px; background: #fff; }
  #track .dot { position: absolute; top: -3px; width: 7px; height: 7px; margin-left: -3.5px; border-radius: 50%; box-sizing: border-box; border: 1px solid #fff; }
  #track .dot.me { top: -4px; width: 9px; height: 9px; margin-left: -4.5px; background: #fff; }
  #msg { top: 15%; left: 0; right: 0; text-align: center; font-size: 13px; opacity: 0; transition: opacity 0.3s; white-space: pre; }
  #big { top: 22%; left: 0; right: 0; text-align: center; font-weight: 200; font-size: min(16vw, 120px); line-height: 1; opacity: 0; transition: opacity 0.2s; }
  #keys { bottom: 58px; left: 0; right: 0; text-align: center; font-size: 10px; color: var(--dim); opacity: 0; transition: opacity 1s; }

  /* ---------- screens (menu / pause / results) ---------- */
  .screen { position: fixed; inset: 0; z-index: 5; display: none; text-shadow: var(--shadow); }
  .screen.on { display: block; animation: in 0.35s ease-out; }
  @keyframes in { from { opacity: 0; } }
  .shade { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(90deg, rgba(0,0,0,0.55), rgba(0,0,0,0.22) 40%, rgba(0,0,0,0) 65%); }
  #pause .shade { background: rgba(0,0,0,0.45); }
  .brand { position: absolute; left: var(--gut); top: max(26px, 7vh); font-weight: 800; font-size: 26px; letter-spacing: 0.34em; }
  .panel { position: absolute; left: var(--gut); bottom: max(40px, 11vh); width: min(440px, calc(100vw - 56px)); }
  .kicker { font-size: 11px; color: var(--dim); margin-bottom: 6px; }
  .title { font-weight: 200; font-size: 64px; line-height: 1; margin-bottom: 10px; }
  .meta { color: var(--dim); font-size: 13px; margin-bottom: 26px; }
  .info { color: var(--dim); font-size: 13px; margin: 0 0 18px 18px; max-width: 360px; }
  .info b { font-weight: 400; color: #fff; }
  .stand { margin: 0 0 24px 18px; font-size: 13px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .stand div { display: flex; gap: 14px; padding: 2px 0; }
  .stand div.me { color: #fff; }
  .stand span:first-child { width: 14px; } .stand span:nth-child(2) { width: 130px; }
  .list .row { position: relative; display: flex; align-items: baseline; gap: 18px; padding: 8px 0 8px 18px; color: var(--dim); cursor: pointer; transition: color 0.15s; }
  .list .row::before { content: ""; position: absolute; left: 0; top: 50%; width: 4px; height: 1px; background: #fff; opacity: 0; transition: opacity 0.15s, width 0.15s; }
  .list .row.sel { color: #fff; }
  .list .row.sel::before { opacity: 1; width: 10px; }
  .row .k { width: 84px; flex: none; font-size: 11px; text-transform: uppercase; letter-spacing: 0.24em; }
  .row .v { font-size: 18px; font-weight: 300; display: flex; align-items: baseline; }
  .row .a { padding: 0 10px; opacity: 0; font-weight: 300; } .row .a:first-child { padding-left: 0; }
  .row.sel .a { opacity: 0.6; } .row .a:hover { opacity: 1; }
  .row.act .k { width: auto; font-size: 13px; letter-spacing: 0.3em; }
  .row.go { padding: 10px 0 10px 18px; } .row.go .k { font-size: 18px; font-weight: 600; letter-spacing: 0.36em; }
  .row .sub { font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--dim); opacity: 0; transition: opacity 0.15s; }
  .row.sel .sub { opacity: 1; }
  #hud.roam #time, #hud.roam #pos, #hud.roam #track { display: none; }
  .hint { position: absolute; right: var(--gut); bottom: max(26px, 5vh); font-size: 10px; color: var(--dim); text-align: right; }
  @media (max-aspect-ratio: 1/1) {
    .shade { background: linear-gradient(0deg, rgba(0,0,0,0.65), rgba(0,0,0,0.2) 55%, rgba(0,0,0,0) 75%); }
    .hint { display: none; }
    .title { font-size: 48px; }
  }

  #fade { position: fixed; inset: 0; background: #000; opacity: 1; pointer-events: none; z-index: 8; transition: opacity 0.38s; }
  #loading { position: fixed; inset: 0; z-index: 9; display: grid; place-items: center; background: #000; transition: opacity 0.5s; }
  #loading.off { opacity: 0; pointer-events: none; }
  #loading .m { font-weight: 800; font-size: 26px; letter-spacing: 0.34em; margin-left: 0.34em; text-align: center; }
  #loading .b { width: 160px; height: 1px; background: rgba(255,255,255,0.2); margin-top: 18px; }
  #loading .b i { display: block; height: 100%; width: 0; background: #fff; transition: width 0.2s; }
</style>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.170.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="loading"><div><div class="m">MX</div><div class="b"><i id="lbar"></i></div></div></div>
<div id="fade"></div>

<div id="hud">
  <div id="time">0:00.00</div>
  <div id="pos"></div>
  <div id="speed"><span id="spd">0</span><small class="caps">km/h</small></div>
  <div id="track"></div>
  <div id="msg" class="caps"></div>
  <div id="big"></div>
  <div id="keys" class="caps">W / ↑ gas &nbsp;·&nbsp; S / ↓ brake &nbsp;·&nbsp; A D steer &nbsp;·&nbsp; R reset &nbsp;·&nbsp; C camera &nbsp;·&nbsp; Esc pause</div>
</div>

<div class="screen" id="menu">
  <div class="shade"></div>
  <div class="brand">MX</div>
  <div class="panel"><div class="list" id="mlist"></div></div>
  <div class="hint caps">↑ ↓ choose &nbsp;·&nbsp; Enter go</div>
</div>

<div class="screen" id="pause">
  <div class="shade"></div>
  <div class="panel"><div class="kicker caps" id="pkick"></div><div class="title">Paused</div><div class="meta caps" style="font-size:10px">W / ↑ gas · S / ↓ brake · A D steer · R reset · C camera</div><div class="list" id="plist"></div></div>
</div>

<div class="screen" id="results">
  <div class="shade"></div>
  <div class="panel"><div class="kicker caps" id="rkick"></div><div class="title" id="rplace"></div><div class="meta caps" id="rmeta"></div><div class="stand" id="rstand"></div><div class="list" id="rlist"></div></div>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { TruckWorld } from '../monster_truck/MonsterTruckSim.js';
import { MonsterTruckRig } from '../monster_truck/MonsterTruckRig.js';
import { SandFX } from '../monster_truck/SandFX.js';
import { SPRINT_ROUTES, BUTTES } from './routes.js';
import { DesertMap } from './DesertMap.js';
import { SandTracks } from './SandTracks.js';
import { WindSand } from './WindSand.js';
import { SprintRace, SprintAI } from './SprintRace.js';

const $ = (id) => document.getElementById(id);
const fmt = SprintRace.fmt;
const params = new URLSearchParams(location.search);
const store = { get(k) { try { return JSON.parse(localStorage.getItem('mx.' + k)); } catch { return null; } }, set(k, v) { try { localStorage.setItem('mx.' + k, JSON.stringify(v)); } catch {} } };

// ---------------------------------------------------------------- renderer / scene
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance', preserveDrawingBuffer: params.has('capture') });
renderer.setPixelRatio(Math.min(devicePixelRatio, params.has('capture') ? 1 : 1.5));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.3, 14000);
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

const sunElev = +(params.get('sun') || store.get('sun') || 21);
const map = new DesertMap({ scene, renderer, terrainOpts: { routes: SPRINT_ROUTES, buttes: BUTTES }, sunElevation: sunElev });
const terrain = map.terrain;
const world = new TruckWorld({ groundHeight: terrain.height, surface: terrain.surface });
const tracks = new SandTracks(scene, { groundHeight: terrain.height, sunDir: map.sunDir });
const windSand = new WindSand(scene, { terrain, wind: terrain.wind });
const sand = new SandFX(scene, { groundHeight: terrain.height, wind: new THREE.Vector3(terrain.wind[0] * 2, 0, terrain.wind[1] * 2) });
for (const r of terrain.routes) map.addRouteDressing(r, new SprintRace(terrain, r.id).checkpoints);
map.addScatter();
for (const c of map.colliders) world.addStaticBox(c);

// ---------------------------------------------------------------- trucks
const TRUCKS = {
  lime: { name: 'Lime', hero: 'monster_truck_lime_black.glb', lod: 'monster_truck_lime_black_lod1.glb' },
  stealth: { name: 'Stealth', hero: 'monster_truck_stealth_gold.glb', lod: 'monster_truck_stealth_gold_lod1.glb' },
};
const RIVAL_NAMES = ['Dusty', 'Sidewinder', 'Mirage'];
const loader = new GLTFLoader();
const glbCache = {};
const loadGLB = (name) => (glbCache[name] ||= loader.loadAsync('../monster_truck/' + name));
async function makeTruck(file) {
  const g = await loadGLB(file);
  const obj = g.scene.clone(true);
  obj.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  scene.add(obj);
  return { obj, rig: new MonsterTruckRig(obj) };
}
const dropTruck = (t) => { const i = world.trucks.indexOf(t); if (i >= 0) world.trucks.splice(i, 1); };

// ---------------------------------------------------------------- settings (kept between visits)
const routeById = (id) => terrain.routes.find((r) => r.id === id) || terrain.routes[0];
const pick = (v, ok, d) => (ok.includes(v) ? v : d);
const opts = {
  route: routeById(params.get('route') || store.get('route')).id,
  truck: pick(params.get('truck') || store.get('truck'), Object.keys(TRUCKS), 'lime'),
  rivals: pick(+(params.get('opp') ?? 3), [0, 1, 2, 3], 3),
};
const nextRoute = (id) => SPRINT_ROUTES[(SPRINT_ROUTES.findIndex((r) => r.id === id) + 1) % SPRINT_ROUTES.length].id;

// ---------------------------------------------------------------- state
// loading → menu → starting → race ⇄ paused → results → (race | menu)
// mode: 'race' (sprint vs rivals) or 'roam' (free drive, no clock); both drive in state 'race'
let state = 'loading', mode = 'race';
let race = null, racers = [], player = null, show = null;
let camMode = 0, lastTime = performance.now(), acc = 0, shake = 0;
const keys = new Set();

function screen(name) { for (const s of ['menu', 'pause', 'results']) $(s).classList.toggle('on', s === name); }
function hud(on) { $('hud').classList.toggle('on', on); }
function fadeTo(v, ms = 380) {
  const el = $('fade');
  if (el.style.opacity === String(v)) return Promise.resolve();
  el.style.transitionDuration = ms + 'ms'; el.style.opacity = v;
  return new Promise((r) => setTimeout(r, ms));
}

// ---------------------------------------------------------------- one list component for every screen
// rows: { label, values, get, set, fmt } (option, ← → to change) or { label, run, cls } (action)
let ui = null;
function mountList(el, rows, sel = 0, onEnter = null) { ui = { el, rows, sel, onEnter }; drawList(); }
function drawList() {
  const { el, rows } = ui;
  el.innerHTML = rows.map((r, i) => r.values
    ? `<div class="row" data-i="${i}"><span class="k">${r.label}</span><span class="v"><span class="a" data-d="-1">‹</span><span>${r.fmt(r.get())}</span><span class="a" data-d="1">›</span></span></div>`
    : `<div class="row act ${r.cls || ''}" data-i="${i}"><span class="k">${r.label}</span>${r.sub ? `<span class="sub">${r.sub()}</span>` : ''}</div>`).join('');
  el.querySelectorAll('.row').forEach((rowEl) => {
    const i = +rowEl.dataset.i;
    rowEl.onmouseenter = () => { ui.sel = i; mark(); };
    rowEl.onclick = (e) => { ui.sel = i; if (rows[i].values) change(+(e.target.dataset.d || 1)); else rows[i].run(); };
  });
  mark();
}
function mark() { ui.el.querySelectorAll('.row').forEach((r, i) => r.classList.toggle('sel', i === ui.sel)); }
function move(d) { ui.sel = (ui.sel + d + ui.rows.length) % ui.rows.length; mark(); }
function change(d) {
  const r = ui.rows[ui.sel]; if (!r.values) return;
  const i = r.values.indexOf(r.get());
  r.set(r.values[(i + d + r.values.length) % r.values.length]); drawList();
}
function confirm() { const r = ui.rows[ui.sel]; if (r.run) r.run(); else ui.onEnter?.(); }
function back() { if (state === 'paused') resume(); else if (state === 'results') toMenu(); }

// ---------------------------------------------------------------- menu
// two choices: Roam (free drive) or Race (next sprint route in rotation, vs rivals)
const menuRows = [
  { label: 'Roam', cls: 'go', sub: () => 'Free drive', run: () => startRoam() },
  { label: 'Race', cls: 'go', sub: () => routeById(opts.route).name, run: () => startRace() },
];
function openMenu() { state = 'menu'; hud(false); screen('menu'); mountList($('mlist'), menuRows, store.get('mode') === 'roam' ? 0 : 1); }

// showroom: the chosen truck parked on the start grid, slow orbit camera
let showTok = 0, orbit = 0, snapCam = false;
async function stage() {
  const tok = ++showTok, routeId = opts.route, kind = opts.truck;
  const moving = !show || show.routeId !== routeId;
  if (moving && show) await fadeTo(1);
  if (tok !== showTok) return;
  if (!show || show.kind !== kind) {
    const m = await makeTruck(TRUCKS[kind].hero);
    if (tok !== showTok) { scene.remove(m.obj); return; }
    if (show) scene.remove(show.obj);
    show = { ...show, obj: m.obj, rig: m.rig, kind };
  }
  show.truck ||= world.addTruck({ x: 0, z: 0 });
  if (moving) {
    const sp = new SprintRace(terrain, routeId).gridSlots(1)[0];
    show.truck.reset({ x: sp.x, z: sp.z, yaw: sp.yaw });
    show.routeId = routeId; orbit = sp.yaw + 0.75; snapCam = true;
    await map.init(sp.x, sp.z);
    if (tok !== showTok) return;
  }
  syncVisual(show, 0, false);
  await fadeTo(0);
}
function clearShow() { showTok++; if (!show) return; scene.remove(show.obj); dropTruck(show.truck); show = null; }

// ---------------------------------------------------------------- race
function clearRace() {
  for (const rc of racers) { scene.remove(rc.obj); dropTruck(rc.truck); }
  racers = []; player = null; race = null; tracks.clear(); msg(null); big(null);
}

function hookFX(truck, isP) {
  truck.onLand = (v) => { if (v > 3) sand.burst(new THREE.Vector3(truck.pos[0], truck.pos[1], truck.pos[2]), v); if (isP && v > 6) shake = Math.min(1, v / 14); };
  truck.onImpact = (other, v, p) => { if (v > 3) sand.burst(new THREE.Vector3(p[0], p[1], p[2]), v * 0.6); if (isP) shake = Math.min(1, v / 12); };
}
function snapChase(yaw) {
  const p = player.truck.pos;
  camPos.set(p[0] - Math.sin(yaw) * 12.5, p[1] + 5.2, p[2] - Math.cos(yaw) * 12.5);
  camLook.set(p[0] + Math.sin(yaw) * 7, p[1] + 1.6, p[2] + Math.cos(yaw) * 7);
}
function showKeys() {
  const seen = store.get('hints') || 0;
  if (seen < 3) { store.set('hints', seen + 1); $('keys').style.opacity = 1; setTimeout(() => ($('keys').style.opacity = 0), 7000); }
}

// Roam: just you and the desert – no clock, no checkpoints, no rivals
async function startRoam() {
  if (state === 'starting') return;
  state = 'starting'; mode = 'roam'; store.set('mode', 'roam'); screen(null); hud(false); keys.clear();
  await fadeTo(1);
  clearShow(); clearRace();
  const sp = new SprintRace(terrain, opts.route).gridSlots(1)[0];
  const { obj, rig } = await makeTruck(TRUCKS[opts.truck].hero);
  const truck = world.addTruck({ x: sp.x, z: sp.z, yaw: sp.yaw, autoRecoverAfter: 2 });
  hookFX(truck, true);
  player = { id: 'you', truck, obj, rig, isP: true }; racers = [player];
  await map.init(sp.x, sp.z);
  snapChase(sp.yaw);
  $('hud').classList.add('roam');
  state = 'race'; hud(true); lastTime = performance.now(); acc = 0;
  showKeys();
  fadeTo(0, 600);
}

async function startRace(routeId = opts.route) {
  if (state === 'starting') return;
  state = 'starting'; mode = 'race'; store.set('mode', 'race'); screen(null); hud(false); keys.clear();
  await fadeTo(1);
  clearShow(); clearRace();
  $('hud').classList.remove('roam');
  race = new SprintRace(terrain, routeId);
  const route = race.route, n = opts.rivals + 1;
  const slots = race.gridSlots(n), order = [...slots.keys()].reverse();   // you start at the back: someone to chase
  const rivalKinds = Object.keys(TRUCKS).filter((k) => k !== opts.truck).concat(opts.truck);
  for (let i = 0; i < n; i++) {
    const sl = slots[order[i]], isP = i === 0;
    const { obj, rig } = await makeTruck(isP ? TRUCKS[opts.truck].hero : TRUCKS[rivalKinds[(i - 1) % rivalKinds.length]].lod);
    const truck = world.addTruck({ x: sl.x, z: sl.z, yaw: sl.yaw, autoRecoverAfter: 2 });
    const id = isP ? 'you' : 'ai' + i;
    race.addRacer(id, { name: isP ? 'You' : RIVAL_NAMES[i - 1], player: isP });
    const rc = { id, truck, obj, rig, isP };
    if (!isP || params.has('autopilot')) {
      const c = route.pointAt(sl.s), lane = (sl.x - c.x) * c.tz - (sl.z - c.z) * c.tx;
      rc.ai = new SprintAI(race, truck, id, { skill: 0.72 + 0.1 * i, lane, seed: i * 1.7, world });
    }
    hookFX(truck, isP);
    racers.push(rc); if (isP) player = rc;
  }
  // progress line: checkpoint ticks, finish, one dot per racer (you = solid)
  $('track').innerHTML = race.checkpoints.map((s) => `<div class="cp" style="left:${((s - race.startS) / race.length) * 100}%"></div>`).join('')
    + '<div class="fin"></div>' + racers.map((r) => `<div class="dot ${r.isP ? 'me' : ''}" id="dot_${r.id}"></div>`).join('');
  $('pos').style.display = n > 1 ? '' : 'none';
  race.onCheckpoint = (r, i, t) => {
    if (!r.player) return;
    const b = store.get('best.' + route.id), d = b?.splits?.[i] != null ? t - b.splits[i] : null;
    msg(`Checkpoint ${i + 1} / ${race.checkpoints.length}` + (d == null ? '' : `     ${d <= 0 ? '−' : '+'}${Math.abs(d).toFixed(2)}`), 1800);
  };
  race.onMissed = (r) => { if (r.player) msg('Missed checkpoint – go back through it', 3000); };
  race.onWrongWay = (r, on) => { if (r.player) msg(on ? 'Wrong way' : null); };
  race.onOffCourse = (r) => { if (r.player) respawn(player); };
  await map.init(player.truck.pos[0], player.truck.pos[2]);
  snapChase(slots[order[0]].yaw);
  state = 'race'; hud(true); lastTime = performance.now(); acc = 0;
  showKeys();
  race.start();
  fadeTo(0, 600);
}

function respawn(rc) {
  if (!rc) return;
  if (race) { const sp = race.respawnPoint(rc.id); rc.truck.reset({ x: sp.x, z: sp.z, yaw: sp.yaw }); return; }
  // roam: back on its wheels where it is, facing the way it was pointing
  const t = rc.truck, f = t.forward;
  t.reset({ x: t.pos[0], z: t.pos[2], yaw: Math.atan2(f[0], f[2]) });
}

function pause() {
  if (state !== 'race') return;
  state = 'paused'; hud(false); keys.clear();
  $('pkick').textContent = race ? race.route.name : 'Roam';
  screen('pause');
  mountList($('plist'), race
    ? [{ label: 'Resume', run: resume }, { label: 'Restart', run: () => startRace(race.route.id) }, { label: 'Quit to menu', run: toMenu }]
    : [{ label: 'Resume', run: resume }, { label: 'Quit to menu', run: toMenu }]);
}
function resume() { if (state !== 'paused') return; state = 'race'; screen(null); hud(true); lastTime = performance.now(); }

async function toMenu() {
  if (state === 'starting') return;
  state = 'starting'; screen(null); hud(false);
  await fadeTo(1);
  clearRace(); openMenu();
  await stage();
}

function showResults() {
  const route = race.route, tt = route.timeTarget, r = race.racers.get('you'), t = r.time, place = r.place;
  const best = store.get('best.' + route.id), isBest = !best || t < best.time;
  if (isBest) store.set('best.' + route.id, { time: t, splits: r.splits });
  const medal = t <= tt.gold ? 'Gold' : t <= tt.silver ? 'Silver' : t <= tt.bronze ? 'Bronze' : null;
  const solo = race.racers.size === 1;
  $('rkick').textContent = route.name;
  $('rplace').textContent = solo ? fmt(t) : ['', '1st', '2nd', '3rd', '4th'][place];
  $('rmeta').innerHTML = [solo ? null : fmt(t), medal, isBest ? 'New best' : 'Best ' + fmt(best.time)].filter(Boolean).join(' &nbsp;·&nbsp; ');
  $('rstand').style.display = solo ? 'none' : '';
  drawStandings();
  state = 'results'; hud(false); msg(null); screen('results');
  opts.route = nextRoute(route.id); store.set('route', opts.route);   // menu's Race moves on to the next route
  mountList($('rlist'), [{ label: 'Race again', run: () => startRace(route.id) }, { label: 'Menu', run: toMenu }]);
}
function drawStandings() {
  $('rstand').innerHTML = race.standings().map((x, i) => `<div class="${x.player ? 'me' : ''}"><span>${i + 1}</span><span>${x.name}</span><span>${x.finished ? fmt(x.time) : '—'}</span></div>`).join('');
}

// ---------------------------------------------------------------- HUD
let msgT = 0;
function msg(t, ms = 0) { clearTimeout(msgT); $('msg').style.opacity = t ? 1 : 0; if (t) $('msg').textContent = t; if (t && ms) msgT = setTimeout(() => ($('msg').style.opacity = 0), ms); }
let bigText = null;
function big(t) { if (t === bigText) return; bigText = t; $('big').style.opacity = t ? 1 : 0; if (t) $('big').textContent = t; }

function updateHUD() {
  const r = race.racers.get('you');
  $('time').textContent = fmt(Math.max(0, r.finished ? r.time : race.clock));
  $('pos').innerHTML = r.place + '<small>/' + race.racers.size + '</small>';
  $('spd').textContent = Math.round(player.truck.speed * 3.6);
  for (const rc of racers) { const el = $('dot_' + rc.id); if (el) el.style.left = (race.progress(rc.id) * 100) + '%'; }
  big(race.state === 'countdown' ? String(Math.max(1, Math.ceil(-race.clock))) : race.clock < 0.8 ? 'GO' : null);
}

// ---------------------------------------------------------------- input: keyboard
addEventListener('keydown', (e) => {
  const c = e.code;
  if (state === 'race') {
    keys.add(c);
    if (c === 'KeyC' && !e.repeat) camMode = (camMode + 1) % 3;
    if (c === 'KeyR' && !e.repeat) respawn(player);
    if (c === 'Escape' || c === 'KeyP') pause();
    if (c.startsWith('Arrow') || c === 'Space') e.preventDefault();
    return;
  }
  if (!ui || !['menu', 'paused', 'results'].includes(state)) return;
  if (c === 'ArrowUp' || c === 'KeyW') move(-1);
  else if (c === 'ArrowDown' || c === 'KeyS') move(1);
  else if (c === 'ArrowLeft' || c === 'KeyA') change(-1);
  else if (c === 'ArrowRight' || c === 'KeyD') change(1);
  else if (c === 'Enter' || c === 'Space') { if (!e.repeat) confirm(); }
  else if (c === 'Escape' || c === 'Backspace') back();
  else return;
  e.preventDefault();
});
addEventListener('keyup', (e) => keys.delete(e.code));
addEventListener('blur', () => { keys.clear(); if (state === 'race') pause(); });

// ---------------------------------------------------------------- input: gamepad (A ok · B back · Start pause · Y reset · X camera)
const pad = { prev: [], dir: '', rep: 0 };
function pollPad(dt) {
  const gp = navigator.getGamepads?.()[0]; if (!gp) return;
  const b = (i) => !!gp.buttons[i]?.pressed, edge = (i) => b(i) && !pad.prev[i];
  if (state === 'race') {
    if (edge(9)) pause();
    if (edge(3)) respawn(player);
    if (edge(2)) camMode = (camMode + 1) % 3;
  } else if (ui && ['menu', 'paused', 'results'].includes(state)) {
    if (edge(0)) confirm();
    else if (edge(1)) back();
    else if (edge(9)) state === 'menu' ? confirm() : back();
    const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
    const dir = b(12) || ay < -0.5 ? 'u' : b(13) || ay > 0.5 ? 'd' : b(14) || ax < -0.5 ? 'l' : b(15) || ax > 0.5 ? 'r' : '';
    const act = (d) => (d === 'u' ? move(-1) : d === 'd' ? move(1) : d === 'l' ? change(-1) : d === 'r' ? change(1) : 0);
    if (dir !== pad.dir) { pad.dir = dir; pad.rep = 0.4; act(dir); }
    else if (dir && (pad.rep -= dt) <= 0) { pad.rep = 0.14; act(dir); }
  }
  pad.prev = gp.buttons.map((x) => x.pressed);
}

let steerS = 0;
function readInput(dt) {
  let th = keys.has('KeyW') || keys.has('ArrowUp') ? 1 : 0, br = keys.has('KeyS') || keys.has('ArrowDown') || keys.has('Space') ? 1 : 0;
  let st = (keys.has('KeyA') || keys.has('ArrowLeft') ? 1 : 0) - (keys.has('KeyD') || keys.has('ArrowRight') ? 1 : 0);
  const gp = navigator.getGamepads?.()[0];
  if (gp) {
    const ax = gp.axes[0] || 0; if (Math.abs(ax) > 0.12) st = -ax;
    th = Math.max(th, gp.buttons[7]?.value || 0); br = Math.max(br, gp.buttons[6]?.value || 0);
  }
  steerS += (st - steerS) * Math.min(1, dt * (Math.abs(st) > Math.abs(steerS) ? 6 : 10));
  return { throttle: th, brake: br, steer: steerS };
}

// ---------------------------------------------------------------- cameras
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
function updateCamera(dt) {
  if (window.__mx.freeCam) return;
  const t = player.truck, p = new THREE.Vector3(...t.rootPosition);
  const f = new THREE.Vector3(t.forward[0], 0, t.forward[2]).normalize();
  const vel = new THREE.Vector3(t.vel[0], 0, t.vel[2]);
  if (vel.length() > 4) f.lerp(vel.clone().normalize(), 0.5).normalize();
  const dist = [12.5, 20, 7][camMode], height = [5.2, 8.5, 3.2][camMode];
  const want = p.clone().addScaledVector(f, -dist); want.y = p.y + height;
  const g = terrain.height(want.x, want.z); want.y = Math.max(want.y, g + 2.2);
  camPos.lerp(want, 1 - Math.exp(-dt * (camMode === 2 ? 12 : 4.5)));
  camPos.y = Math.max(camPos.y, terrain.height(camPos.x, camPos.z) + 1.6);
  const look = p.clone().addScaledVector(f, 7 + t.speed * 0.25); look.y = p.y + 1.6;
  camLook.lerp(look, 1 - Math.exp(-dt * 8));
  camera.position.copy(camPos);
  if (shake > 0) { camera.position.x += (Math.random() - 0.5) * shake * 0.5; camera.position.y += (Math.random() - 0.5) * shake * 0.5; shake = Math.max(0, shake - dt * 2.5); }
  camera.lookAt(camLook);
  camera.fov = 60 + Math.min(10, t.speed * 0.35);
}
function showroomCamera(dt) {
  if (!show?.truck || window.__mx.freeCam) return;
  orbit += dt * 0.07;
  const p = show.truck.rootPosition, R = 14 / Math.min(1, camera.aspect * 1.25);   // pull back on tall screens
  const want = new THREE.Vector3(p[0] + Math.sin(orbit) * R, 0, p[2] + Math.cos(orbit) * R);
  want.y = Math.max(p[1] + 2.6, terrain.height(want.x, want.z) + 1.8);
  if (snapCam) { camPos.copy(want); snapCam = false; } else camPos.lerp(want, 1 - Math.exp(-dt * 3));
  camera.position.copy(camPos);
  camLook.set(p[0], p[1] + 1.4, p[2]);
  camera.lookAt(camLook);
  camera.fov = 38;
}
function frameCamera() {
  // in the menu, slide the picture so the truck sits clear of the menu (right on wide screens, up on tall ones)
  const w = innerWidth, h = innerHeight;
  if (state === 'menu') { if (w > h * 1.1) camera.setViewOffset(w, h, -w * 0.17, 0, w, h); else camera.setViewOffset(w, h, 0, h * 0.18, w, h); }
  else camera.clearViewOffset();
  camera.updateProjectionMatrix();
}

// ---------------------------------------------------------------- frame
const _c = new THREE.Vector3(), _f = new THREE.Vector3(), _l = new THREE.Vector3();
function step(h) {
  if (state === 'menu') { if (show) { show.truck.input = { throttle: 0, brake: 1, steer: 0 }; world.step(h); } return; }
  if (!player) return;
  if (!race) { player.truck.input = readInput(h); world.step(h); return; }   // roam
  const you = race.racers.get('you');
  if (!player.ai) player.truck.input = race.state === 'countdown' ? { throttle: 0, brake: 1, steer: 0 } : you.finished ? { throttle: 0, brake: 0.4, steer: 0 } : readInput(h);
  for (const rc of racers) rc.ai?.update(h);
  world.step(h);
  race.update(h, racers.map((rc) => ({ id: rc.id, pos: rc.truck.pos, vel: rc.truck.vel, forward: rc.truck.forward })));
}
function syncVisual(rc, dt, fx) {
  const t = rc.truck;
  rc.obj.position.set(...t.rootPosition); rc.obj.quaternion.set(...t.rootQuaternion);
  rc.rig.update(dt, { speed: t.wheelSpeed, steer: t.steerAngle, suspension: t.travel });
  if (!fx) return;
  _f.set(...t.forward); _l.set(...t.left);
  for (const k in t.wheels) {
    const wh = t.wheels[k]; if (!wh.contact) continue;
    const [wx, wz] = t.p.wheels[k];
    const hub = t.toWorld([wx, t.p.wheelRadius, wz]);
    _c.set(hub[0], terrain.height(hub[0], hub[2]), hub[2]);
    const sf = terrain.surface(hub[0], hub[2]);
    sand.emitWheel(dt, { id: rc.id + k, contact: _c, forward: _f, left: _l, slipLong: wh.slipLong * (0.4 + 0.6 * sf.soft), slipLat: wh.slipLat * (0.5 + 0.5 * sf.soft), speed: t.speed });
    tracks.stamp(rc.id + k, hub[0], hub[2], _f.x, _f.z, 0.35 + 0.65 * sf.soft);
  }
}
let standT = 0;
function frame(dt) {
  pollPad(dt);
  if (state === 'menu' || state === 'race' || state === 'results') {
    const h = 1 / 60; acc = Math.min(acc + dt, 0.1);
    while (acc >= h) { step(h); acc -= h; }
  }
  const live = state === 'menu' ? (show ? [show] : []) : racers;
  if (state === 'menu') { if (show) syncVisual(show, dt, false); showroomCamera(dt); }
  else if (player && state !== 'starting') { for (const rc of racers) syncVisual(rc, state === 'paused' ? 0 : dt, state !== 'paused'); updateCamera(state === 'paused' ? 0 : dt); }
  frameCamera();
  if (state !== 'paused') {
    map.update(dt, camera, live.map((r) => r.truck.pos), live.map((r) => r.truck.vel));
    tracks.update(map.time);
    windSand.update(dt, camera, map.gust, renderer);
    sand.update(dt, camera);
  }
  if (state === 'race' && !race && player) $('spd').textContent = Math.round(player.truck.speed * 3.6);
  if (state === 'race' && race) {
    updateHUD();
    const you = race.racers.get('you');
    if (you.finished && race.clock - you.time > 1.6) showResults();
  }
  if (state === 'results' && (standT += dt) > 0.5) { standT = 0; drawStandings(); }
}

function loop() {
  const now = performance.now(), dt = Math.min(0.05, (now - lastTime) / 1000); lastTime = now;
  frame(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

// ---------------------------------------------------------------- boot
window.__mx = { THREE, scene, camera, renderer, map, terrain, world, tracks, windSand, sand, get state() { return state; }, get race() { return race; }, get racers() { return racers; }, startRace, toMenu, frame, SprintRace, opts };
(async () => {
  const sp = new SprintRace(terrain, opts.route).gridSlots(1)[0];
  await map.init(sp.x, sp.z, (p) => { $('lbar').style.width = (p * 100).toFixed(0) + '%'; });
  camera.position.set(sp.x - 20, terrain.height(sp.x, sp.z) + 12, sp.z - 20); camera.lookAt(sp.x, 0, sp.z);
  $('loading').classList.add('off');
  if (!params.has('manual')) loop();
  if (params.has('roam')) startRoam();                                  // ?roam jumps straight into free drive
  else if (params.has('route') && !params.has('menu')) startRace();   // ?route=… jumps straight into a race
  else { openMenu(); await stage(); }
})();
</script>
</body>

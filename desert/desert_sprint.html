<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MX</title>
<style>
  /* MX UI – black and white only. The scenery is the colour. */
  :root { --dim: rgba(255,255,255,0.55); --faint: rgba(255,255,255,0.24); --shadow: 0 1px 2px rgba(0,0,0,0.45), 0 0 22px rgba(0,0,0,0.3); --gut: max(28px, 6vw); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #fff; font: 400 14px/1.4 "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; user-select: none; }
  canvas { display: block; }
  .caps { text-transform: uppercase; letter-spacing: 0.24em; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; text-shadow: var(--shadow); opacity: 0; transition: opacity 0.4s; }
  #hud.on { opacity: 1; }
  #hud > div { position: absolute; }
  #time { top: 22px; left: 28px; font-weight: 300; font-size: 30px; font-variant-numeric: tabular-nums; letter-spacing: 0.03em; }
  #pos { top: 22px; right: 28px; font-weight: 300; font-size: 30px; }
  #pos small { font-size: 14px; color: var(--dim); margin-left: 3px; }
  #speed { bottom: 22px; right: 28px; text-align: right; font-weight: 300; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
  #speed small { display: block; margin-top: 4px; font-size: 10px; color: var(--dim); }
  #track { bottom: 32px; left: 50%; transform: translateX(-50%); width: min(44vw, 440px); height: 1px; background: var(--faint); box-shadow: 0 0 6px rgba(0,0,0,0.25); }
  #track .cp { position: absolute; top: -3px; width: 1px; height: 7px; background: var(--dim); }
  #track .fin { position: absolute; right: 0; top: -5px; width: 1px; height: 11px; background: #fff; }
  #track .dot { position: absolute; top: -3px; width: 7px; height: 7px; margin-left: -3.5px; border-radius: 50%; box-sizing: border-box; border: 1px solid #fff; }
  #track .dot.me { top: -4px; width: 9px; height: 9px; margin-left: -4.5px; background: #fff; }
  #msg { top: 15%; left: 0; right: 0; text-align: center; font-size: 13px; opacity: 0; transition: opacity 0.3s; white-space: pre; }
  #big { top: 22%; left: 0; right: 0; text-align: center; font-weight: 200; font-size: min(16vw, 120px); line-height: 1; opacity: 0; transition: opacity 0.2s; }
  #fps { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); z-index: 7; font: 400 10px/1 "Segoe UI", system-ui, sans-serif; letter-spacing: 0.2em; color: rgba(255,255,255,0.7); text-shadow: var(--shadow); pointer-events: none; font-variant-numeric: tabular-nums; }
  #keys { bottom: 58px; left: 0; right: 0; text-align: center; font-size: 10px; color: var(--dim); opacity: 0; transition: opacity 1s; }

  /* ---------- screens (menu / pause / results) ---------- */
  .screen { position: fixed; inset: 0; z-index: 5; display: none; text-shadow: var(--shadow); }
  .screen.on { display: block; animation: in 0.35s ease-out; }
  @keyframes in { from { opacity: 0; } }
  .shade { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(90deg, rgba(0,0,0,0.55), rgba(0,0,0,0.22) 40%, rgba(0,0,0,0) 65%); }
  #pause .shade { background: rgba(0,0,0,0.45); }
  .brand { position: absolute; left: var(--gut); top: max(26px, 7vh); font-weight: 800; font-size: 26px; letter-spacing: 0.34em; }
  .panel { position: absolute; left: var(--gut); bottom: max(40px, 11vh); width: min(440px, calc(100vw - 56px)); }
  .kicker { font-size: 11px; color: var(--dim); margin-bottom: 6px; }
  .title { font-weight: 200; font-size: 64px; line-height: 1; margin-bottom: 10px; }
  .meta { color: var(--dim); font-size: 13px; margin-bottom: 26px; }
  .info { color: var(--dim); font-size: 13px; margin: 0 0 18px 18px; max-width: 360px; }
  .info b { font-weight: 400; color: #fff; }
  .stand { margin: 0 0 24px 18px; font-size: 13px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .stand div { display: flex; gap: 14px; padding: 2px 0; }
  .stand div.me { color: #fff; }
  .stand span:first-child { width: 14px; } .stand span:nth-child(2) { width: 130px; }
  .list .row { position: relative; display: flex; align-items: baseline; gap: 18px; padding: 8px 0 8px 18px; color: var(--dim); cursor: pointer; transition: color 0.15s; }
  .list .row::before { content: ""; position: absolute; left: 0; top: 50%; width: 4px; height: 1px; background: #fff; opacity: 0; transition: opacity 0.15s, width 0.15s; }
  .list .row.sel { color: #fff; }
  .list .row.sel::before { opacity: 1; width: 10px; }
  .row .k { width: 84px; flex: none; font-size: 11px; text-transform: uppercase; letter-spacing: 0.24em; }
  .row .v { font-size: 18px; font-weight: 300; display: flex; align-items: baseline; }
  .row .a { padding: 0 10px; opacity: 0; font-weight: 300; } .row .a:first-child { padding-left: 0; }
  .row.sel .a { opacity: 0.6; } .row .a:hover { opacity: 1; }
  .row.act .k { width: auto; font-size: 13px; letter-spacing: 0.3em; }
  .row.go { padding: 10px 0 10px 18px; } .row.go .k { font-size: 18px; font-weight: 600; letter-spacing: 0.36em; }
  .row .sub { font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--dim); opacity: 0; transition: opacity 0.15s; }
  .row.sel .sub { opacity: 1; }
  #hud.roam #time, #hud.roam #pos, #hud.roam #track { display: none; }
  .hint { position: absolute; right: var(--gut); bottom: max(26px, 5vh); font-size: 10px; color: var(--dim); text-align: right; }
  .list .row:not(.go) + .row.go { margin-top: 16px; }   /* space between the vehicle options and Roam / Race */
  @media (max-aspect-ratio: 1/1) {
    .shade { background: linear-gradient(0deg, rgba(0,0,0,0.65), rgba(0,0,0,0.2) 55%, rgba(0,0,0,0) 75%); }
    .hint { display: none; }
    .title { font-size: 48px; }
  }

  #fade { position: fixed; inset: 0; background: #000; opacity: 1; pointer-events: none; z-index: 8; transition: opacity 0.38s; }
  #loading { position: fixed; inset: 0; z-index: 9; display: grid; place-items: center; background: #000; transition: opacity 0.5s; }
  #loading.off { opacity: 0; pointer-events: none; }
  #gpu { position: fixed; z-index: 6; top: max(26px, 7vh); right: var(--gut); max-width: 300px; text-align: right; font-size: 11px; line-height: 1.5; color: rgba(255,255,255,0.82); text-shadow: var(--shadow); display: none; pointer-events: none; }
  #gpu b { display: block; font-weight: 600; color: #fff; letter-spacing: 0.24em; text-transform: uppercase; font-size: 10px; margin-bottom: 4px; }
  body:has(#menu.on) #gpu, body:has(#pause.on) #gpu { display: block; }
  #loading .m { font-weight: 800; font-size: 26px; letter-spacing: 0.34em; margin-left: 0.34em; text-align: center; }
  #loading .b { width: 160px; height: 1px; background: rgba(255,255,255,0.2); margin-top: 18px; }
  #loading .b i { display: block; height: 100%; width: 0; background: #fff; transition: width 0.2s; }
</style>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.170.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="loading"><div><div class="m">MX</div><div class="b"><i id="lbar"></i></div></div></div>
<div id="fade"></div>

<div id="fps" style="display:none"></div>
<div id="hud">
  <div id="time">0:00.00</div>
  <div id="pos"></div>
  <div id="speed"><span id="spd">0</span><small class="caps">km/h</small></div>
  <div id="track"></div>
  <div id="msg" class="caps"></div>
  <div id="big"></div>
  <div id="keys" class="caps">W / ↑ gas &nbsp;·&nbsp; S / ↓ brake &nbsp;·&nbsp; A D steer / lean &nbsp;·&nbsp; R reset &nbsp;·&nbsp; C camera &nbsp;·&nbsp; Esc pause</div>
</div>

<div class="screen" id="menu">
  <div class="shade"></div>
  <div class="brand">MX</div>
  <div class="panel"><div class="list" id="mlist"></div></div>
  <div class="hint caps">↑ ↓ choose &nbsp;·&nbsp; ← → change &nbsp;·&nbsp; Enter go</div>
</div>

<div class="screen" id="pause">
  <div class="shade"></div>
  <div class="panel"><div class="kicker caps" id="pkick"></div><div class="title">Paused</div><div class="meta caps" style="font-size:10px">W / ↑ gas · S / ↓ brake · A D steer / lean · R reset · C camera<br>bike in the air: W nose up · S nose down</div><div class="list" id="plist"></div></div>
</div>

<div class="screen" id="results">
  <div class="shade"></div>
  <div class="panel"><div class="kicker caps" id="rkick"></div><div class="title" id="rplace"></div><div class="meta caps" id="rmeta"></div><div class="stand" id="rstand"></div><div class="list" id="rlist"></div></div>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { TruckWorld } from '../monster_truck/MonsterTruckSim.js';
import { MonsterTruckRig } from '../monster_truck/MonsterTruckRig.js';
import { SandFX } from '../monster_truck/SandFX.js';
import { addBike } from '../dirt_bike/DirtBikeSim.js';
import { DirtBikeRig } from '../dirt_bike/DirtBikeRig.js';
import { SPRINT_ROUTES, BUTTES } from './routes.js';
import { DesertMap } from './DesertMap.js';
import { SandTracks } from './SandTracks.js';
import { WindSand } from './WindSand.js';
import { SprintRace, SprintAI } from './SprintRace.js';

const $ = (id) => document.getElementById(id);
const fmt = SprintRace.fmt;
const params = new URLSearchParams(location.search);
const store = { get(k) { try { return JSON.parse(localStorage.getItem('mx.' + k)); } catch { return null; } }, set(k, v) { try { localStorage.setItem('mx.' + k, JSON.stringify(v)); } catch {} } };

// ---------------------------------------------------------------- renderer / scene
// the scene is drawn into a 4× MSAA HDR target and finished by the post chain (bloom → tone map → grade),
// so the canvas itself needs no antialiasing
const renderer = new THREE.WebGLRenderer({ antialias: false, stencil: true, powerPreference: 'high-performance', preserveDrawingBuffer: params.has('capture') });
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.3, 14000);

// which GPU is the browser drawing on? Gaming laptops often hand the browser the built-in chip
// (Windows "power saving") instead of the NVIDIA / Radeon RX card – the menu says how to switch.
const gpu = (() => {
  const gl = renderer.getContext(), ext = gl.getExtension('WEBGL_debug_renderer_info');
  const name = String(ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER));
  const parts = name.startsWith('ANGLE (') ? name.slice(7, -1).split(',') : [name];
  const short = (parts[1] || parts[0]).replace(/\(0x[0-9a-f]+\)|Direct3D.*|OpenGL.*|Vulkan.*|\((TM|R)\)/gi, '').replace(/\s+/g, ' ').trim();
  return {
    name, short,
    software: /SwiftShader|llvmpipe|softpipe|Software|Basic Render/i.test(name),
    discrete: /NVIDIA|GeForce|RTX|GTX|Quadro|Radeon RX|Radeon Pro|Arc A\d|Apple M\d (Pro|Max|Ultra)/i.test(name),
  };
})();
// 'high' by default on every GPU. ultra (4K sun shadows, wider detailed terrain ring, supersampling headroom) is
// opt-in with ?quality=ultra – on a gaming laptop it ran at ~20 fps.
const quality = params.get('quality') === 'ultra' ? 'ultra' : 'high';

const sunElev = +(params.get('sun') || store.get('sun') || 21);
const map = new DesertMap({ scene, renderer, terrainOpts: { routes: SPRINT_ROUTES, buttes: BUTTES }, sunElevation: sunElev, quality });
const terrain = map.terrain;
const world = new TruckWorld({ groundHeight: terrain.height, surface: terrain.surface });
const tracks = new SandTracks(scene, { groundHeight: terrain.height, sunDir: map.sunDir });
const bikeTracks = new SandTracks(scene, { groundHeight: terrain.height, sunDir: map.sunDir, width: 0.3, spacing: 0.25, maxSegments: 9000 });
const windSand = new WindSand(scene, { terrain, wind: terrain.wind });
const sand = new SandFX(scene, { groundHeight: terrain.height, wind: new THREE.Vector3(terrain.wind[0] * 2, 0, terrain.wind[1] * 2) });
for (const r of terrain.routes) map.addRouteDressing(r, new SprintRace(terrain, r.id).checkpoints);
map.addScatter();
for (const c of map.colliders) world.addStaticBox(c);

// ---------------------------------------------------------------- post: HDR → bloom → filmic tone map → grade
// HDR target with 4× MSAA and a stencil buffer (tyre tracks use it so overlaps don't stack darker)
const hdrRT = new THREE.WebGLRenderTarget(innerWidth, innerHeight, { type: THREE.HalfFloatType, samples: 4, stencilBuffer: true });
const composer = new EffectComposer(renderer, hdrRT);
composer.addPass(new RenderPass(scene, camera));
// bloom only on what is truly bright (the sun, its glare in the haze, quartz glints, chrome); the sun disc is
// thousands of times brighter than the sand, so its contribution is clamped before blurring
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.3, 0.6, 1.1);
bloom.materialHighPassFilter.fragmentShader = bloom.materialHighPassFilter.fragmentShader.replace(
  'vec4 texel = texture2D( tDiffuse, vUv );', 'vec4 texel = min( texture2D( tDiffuse, vUv ), vec4( 6.0 ) );');
composer.addPass(bloom);
composer.addPass(new OutputPass());   // ACES filmic + exposure + sRGB (settings from DesertMap)
// colour grade in display space: gentle S-curve, warm highlights / cooler shade, a touch of saturation,
// lens vignette, and ±½ LSB dither so the sky gradient never bands
const grade = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uAspect: { value: innerWidth / innerHeight } },
  vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse; uniform float uAspect; varying vec2 vUv;
    void main() {
      vec3 c = clamp(texture2D(tDiffuse, vUv).rgb, 0.0, 1.0);
      c = mix(c, c * c * (3.0 - 2.0 * c), 0.16);
      float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
      c += vec3(0.022, 0.008, -0.018) * smoothstep(0.45, 1.0, l) + vec3(-0.012, 0.0, 0.014) * (1.0 - smoothstep(0.0, 0.3, l));
      c = mix(vec3(l), c, 1.07);
      vec2 d = (vUv - 0.5) * vec2(uAspect, 1.0);
      c *= 1.0 - 0.2 * smoothstep(0.4, 1.1, length(d));
      c += (fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453) - 0.5) / 255.0;
      gl_FragColor = vec4(c, 1.0);
    }`,
});
composer.addPass(grade);
function render() { composer.render(); }
function resize() {
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); grade.uniforms.uAspect.value = camera.aspect;
}
addEventListener('resize', resize);

// ---------------------------------------------------------------- vehicles: monster trucks or dirt bikes
const TRUCKS = {
  lime: { name: 'Lime', hero: 'monster_truck_lime_black.glb', lod: 'monster_truck_lime_black_lod1.glb' },
  stealth: { name: 'Stealth', hero: 'monster_truck_stealth_gold.glb', lod: 'monster_truck_stealth_gold_lod1.glb' },
};
const BIKE = { hero: 'dirt_bike_white.glb', lod: 'dirt_bike_white_lod1.glb' };
const KITS = { orange: 'Orange', red: 'Red', lime: 'Lime', blue: 'Blue' };   // rider kits (DirtBikeRig RIDER_KITS)
const RIVAL_KITS = ['blue', 'yellow', 'purple'];
const RIVAL_NAMES = ['Dusty', 'Sidewinder', 'Mirage'];
const maxAniso = renderer.capabilities.getMaxAnisotropy();
async function precompile(obj) { try { await renderer.compileAsync(obj, camera, scene); } catch (e) { console.warn('precompile', e); } }
const loader = new GLTFLoader();
const glbCache = {};
const loadGLB = (path) => (glbCache[path] ||= loader.loadAsync(path));
async function makeVehicle(kind, file, kit) {
  const g = await loadGLB((kind === 'bike' ? '../dirt_bike/' : '../monster_truck/') + file);
  const obj = g.scene.clone(true);
  obj.traverse((o) => {
    if (!o.isMesh) return;
    o.castShadow = true; o.receiveShadow = true;
    for (const m of [].concat(o.material)) for (const k of ['map', 'normalMap', 'roughnessMap', 'metalnessMap', 'aoMap', 'emissiveMap'])
      if (m[k] && m[k].anisotropy !== maxAniso) { m[k].anisotropy = maxAniso; m[k].needsUpdate = true; }   // crisp decals / tread at grazing angles
  });
  scene.add(obj);
  await precompile(obj);
  return { obj, rig: kind === 'bike' ? new DirtBikeRig(obj, { kit, groundHeight: terrain.height }) : new MonsterTruckRig(obj) };
}
const addBody = (kind, o) => (kind === 'bike' ? addBike(world, o) : world.addTruck(o));
const dropTruck = (t) => { const i = world.trucks.indexOf(t); if (i >= 0) world.trucks.splice(i, 1); };

// ---------------------------------------------------------------- settings (kept between visits)
const routeById = (id) => terrain.routes.find((r) => r.id === id) || terrain.routes[0];
const pick = (v, ok, d) => (ok.includes(v) ? v : d);
const opts = {
  route: routeById(params.get('route') || store.get('route')).id,
  vehicle: pick(params.get('vehicle') || (params.get('truck') === 'bike' ? 'bike' : null) || store.get('vehicle'), ['truck', 'bike'], 'truck'),
  truck: pick(params.get('truck') || store.get('truck'), Object.keys(TRUCKS), 'lime'),
  kit: pick(params.get('kit') || store.get('kit'), Object.keys(KITS), 'orange'),
  rivals: pick(+(params.get('opp') ?? 3), [0, 1, 2, 3], 3),
};
// player's ride: { kind, livery, hero file, rider kit }
const ride = () => (opts.vehicle === 'bike' ? { kind: 'bike', livery: opts.kit, hero: BIKE.hero, kit: opts.kit } : { kind: 'truck', livery: opts.truck, hero: TRUCKS[opts.truck].hero });
// best times are kept per route and vehicle type
const bestKey = (routeId, kind = opts.vehicle) => 'best.' + routeId + (kind === 'bike' ? '.bike' : '');
const nextRoute = (id) => SPRINT_ROUTES[(SPRINT_ROUTES.findIndex((r) => r.id === id) + 1) % SPRINT_ROUTES.length].id;

// ---------------------------------------------------------------- state
// loading → menu → starting → race ⇄ paused → results → (race | menu)
// mode: 'race' (sprint vs rivals) or 'roam' (free drive, no clock); both drive in state 'race'
let state = 'loading', mode = 'race';
let race = null, racers = [], player = null, show = null;
let camMode = 0, lastTime = performance.now(), acc = 0, shake = 0;
const keys = new Set();

function screen(name) { for (const s of ['menu', 'pause', 'results']) $(s).classList.toggle('on', s === name); }
function hud(on) { $('hud').classList.toggle('on', on); }
function fadeTo(v, ms = 380) {
  const el = $('fade');
  if (el.style.opacity === String(v)) return Promise.resolve();
  el.style.transitionDuration = ms + 'ms'; el.style.opacity = v;
  return new Promise((r) => setTimeout(r, ms));
}

// ---------------------------------------------------------------- one list component for every screen
// rows: { label, values, get, set, fmt } (option, ← → to change) or { label, run, cls } (action)
let ui = null;
function mountList(el, rows, sel = 0, onEnter = null) { ui = { el, rows, sel, onEnter }; drawList(); }
function drawList() {
  const { el, rows } = ui;
  el.innerHTML = rows.map((r, i) => r.values
    ? `<div class="row" data-i="${i}"><span class="k">${r.label}</span><span class="v"><span class="a" data-d="-1">‹</span><span>${r.fmt(r.get())}</span><span class="a" data-d="1">›</span></span></div>`
    : `<div class="row act ${r.cls || ''}" data-i="${i}"><span class="k">${r.label}</span>${r.sub ? `<span class="sub">${r.sub()}</span>` : ''}</div>`).join('');
  el.querySelectorAll('.row').forEach((rowEl) => {
    const i = +rowEl.dataset.i;
    rowEl.onmouseenter = () => { ui.sel = i; mark(); };
    rowEl.onclick = (e) => { ui.sel = i; if (rows[i].values) change(+(e.target.dataset.d || 1)); else rows[i].run(); };
  });
  mark();
}
function mark() { ui.el.querySelectorAll('.row').forEach((r, i) => r.classList.toggle('sel', i === ui.sel)); }
function move(d) { ui.sel = (ui.sel + d + ui.rows.length) % ui.rows.length; mark(); }
function change(d) {
  const r = ui.rows[ui.sel];
  if (!r.values) return;
  const i = r.values.indexOf(r.get());
  r.set(r.values[(i + d + r.values.length) % r.values.length]); drawList();
}
function confirm() { const r = ui.rows[ui.sel]; if (r.run) r.run(); else ui.onEnter?.(); }
function back() { if (state === 'paused') resume(); else if (state === 'results') toMenu(); }

// ---------------------------------------------------------------- menu
// pick your vehicle (monster truck or dirt bike) and its look, then Roam (free drive) or Race (next sprint route, vs rivals)
const menuRows = [
  { label: 'Vehicle', values: ['truck', 'bike'], get: () => opts.vehicle, set: (v) => { opts.vehicle = v; store.set('vehicle', v); stage(); }, fmt: (v) => (v === 'bike' ? 'Dirt bike' : 'Monster truck') },
  { get label() { return opts.vehicle === 'bike' ? 'Rider' : 'Livery'; },
    get values() { return opts.vehicle === 'bike' ? Object.keys(KITS) : Object.keys(TRUCKS); },
    get: () => (opts.vehicle === 'bike' ? opts.kit : opts.truck),
    set: (v) => { if (opts.vehicle === 'bike') { opts.kit = v; store.set('kit', v); } else { opts.truck = v; store.set('truck', v); } stage(); },
    fmt: (v) => (opts.vehicle === 'bike' ? KITS[v] : TRUCKS[v].name) },
  { label: 'Roam', cls: 'go', sub: () => 'Free drive', run: () => startRoam() },
  { label: 'Race', cls: 'go', sub: () => routeById(opts.route).name, run: () => startRace() },
];
function openMenu() { state = 'menu'; hud(false); screen('menu'); mountList($('mlist'), menuRows, store.get('mode') === 'roam' ? 2 : 3); }

// showroom: the chosen truck parked on the start grid, slow orbit camera
let showTok = 0, orbit = 0, snapCam = false;
async function stage() {
  const tok = ++showTok, routeId = opts.route, rd = ride(), kind = rd.kind + ':' + rd.livery;
  const swapBody = show && show.body !== rd.kind;
  const moving = !show || show.routeId !== routeId || swapBody;
  if (moving && show) await fadeTo(1);
  if (tok !== showTok) return;
  if (!show || show.kind !== kind) {
    const m = await makeVehicle(rd.kind, rd.hero, rd.kit);
    if (tok !== showTok) { scene.remove(m.obj); return; }
    if (show) scene.remove(show.obj);
    show = { ...show, obj: m.obj, rig: m.rig, kind, bike: rd.kind === 'bike' };
  }
  if (swapBody) { dropTruck(show.truck); show.truck = null; }
  show.truck ||= addBody(rd.kind, { x: 0, z: 0 });
  show.body = rd.kind;
  if (moving) {
    const sp = new SprintRace(terrain, routeId).gridSlots(1)[0];
    show.truck.reset({ x: sp.x, z: sp.z, yaw: sp.yaw });
    show.routeId = routeId; orbit = sp.yaw + 0.75; snapCam = true;
    await map.init(sp.x, sp.z);
    if (tok !== showTok) return;
  }
  syncVisual(show, 0, false);
  await fadeTo(0);
}
function clearShow() { showTok++; if (!show) return; show.rig.release?.(); scene.remove(show.obj); dropTruck(show.truck); show = null; }

// ---------------------------------------------------------------- race
function clearRace() {
  for (const rc of racers) { rc.rig.release?.(); scene.remove(rc.obj); dropTruck(rc.truck); }
  racers = []; player = null; race = null; tracks.clear(); bikeTracks.clear(); msg(null); big(null);
}

  truck.onLand = (v) => { if (v > 3) sand.burst(new THREE.Vector3(truck.pos[0], truck.pos[1], truck.pos[2]), v); if (isP && v > 6) shake = Math.min(1, v / 14); };
  truck.onImpact = (other, v, p) => { if (v > 3) sand.burst(new THREE.Vector3(p[0], p[1], p[2]), v * 0.6); if (isP) shake = Math.min(1, v / 12); };

  truck.onCrash = (b, v, info) => {
    sand.burst(new THREE.Vector3(b.pos[0], b.pos[1], b.pos[2]), Math.max(4, v) * (info?.ejected ? 1.1 : 0.8));
    if (isP) { shake = Math.min(1, (info?.ejected ? 0.7 : 0.4) + v / 14); msg(info?.ejected ? 'Thrown off' : 'Crashed', info?.ejected ? 2600 : 1600); }

}

  const p = player.truck.pos, cv = CAM[player.bike ? 'bike' : 'truck'][0];
  camPos.set(p[0] - Math.sin(yaw) * cv.dist, p[1] + cv.height, p[2] - Math.cos(yaw) * cv.dist);

  const seen = store.get('hints') || 0;

}

// Roam: just you and the desert – no clock, no checkpoints, no rivals

  if (state === 'starting') return;
  state = 'starting'; mode = 'roam'; store.set('mode', 'roam'); screen(null); hud(false); keys.clear();
  await fadeTo(1);
  clearShow(); clearRace();
  const sp = new SprintRace(terrain, opts.route).gridSlots(1)[0], rd = ride();
  const { obj, rig } = await makeVehicle(rd.kind, rd.hero, rd.kit);
  const truck = addBody(rd.kind, { x: sp.x, z: sp.z, yaw: sp.yaw, autoRecoverAfter: 2 });
  hookFX(truck, true);
  player = { id: 'you', truck, obj, rig, isP: true, bike: rd.kind === 'bike' }; racers = [player];
  await map.init(sp.x, sp.z);
  snapChase(sp.yaw);
  $('hud').classList.add('roam');
  state = 'race'; hud(true); lastTime = performance.now(); acc = 0;
  showKeys();

}

async function startRace(routeId = opts.route) {

  const slots = race.gridSlots(n), order = [...slots.keys()].reverse();   // you start at the back: someone to chase
  const rivalKinds = Object.keys(TRUCKS).filter((k) => k !== opts.truck).concat(opts.truck);

    const { obj, rig } = await makeVehicle(rd.kind, file, isP ? rd.kit : RIVAL_KITS[i - 1]);
    const truck = addBody(rd.kind, { x: sl.x, z: sl.z, yaw: sl.yaw, autoRecoverAfter: 2 });
    const id = isP ? 'you' : 'ai' + i;
    race.addRacer(id, { name: isP ? 'You' : RIVAL_NAMES[i - 1], player: isP });

    + '<div class="fin"></div>' + racers.map((r) => `<div class="dot ${r.isP ? 'me' : ''}" id="dot_${r.id}"></div>`).join('');
  $('pos').style.display = n > 1 ? '' : 'none';
  race.onCheckpoint = (r, i, t) => {
    if (!r.player) return;
    const b = store.get(bestKey(route.id)), d = b?.splits?.[i] != null ? t - b.splits[i] : null;
    msg(`Checkpoint ${i + 1} / ${race.checkpoints.length}` + (d == null ? '' : `     ${d <= 0 ? '−' : '+'}${Math.abs(d).toFixed(2)}`), 1800);

function respawn(rc) {
  if (!rc) return;
  if (race) { const sp = race.respawnPoint(rc.id); rc.truck.reset({ x: sp.x, z: sp.z, yaw: sp.yaw }); return; }
  // roam: back on its wheels where it is, facing the way it was pointing
  const t = rc.truck, f = t.forward;
  t.reset({ x: t.pos[0], z: t.pos[2], yaw: Math.atan2(f[0], f[2]) });
}

function pause() {
  if (state !== 'race') return;
  state = 'paused'; hud(false); keys.clear();
  $('pkick').textContent = race ? race.route.name : 'Roam';
  screen('pause');
  mountList($('plist'), race
    ? [{ label: 'Resume', run: resume }, { label: 'Restart', run: () => startRace(race.route.id) }, { label: 'Quit to menu', run: toMenu }]

}

async function toMenu() {
  if (state === 'starting') return;
  state = 'starting'; screen(null); hud(false);
  await fadeTo(1);
  clearRace(); openMenu();
  await stage();
}

function showResults() {
  const route = race.route, tt = route.timeTarget, r = race.racers.get('you'), t = r.time, place = r.place;
  const best = store.get(bestKey(route.id)), isBest = !best || t < best.time;
  if (isBest) store.set(bestKey(route.id), { time: t, splits: r.splits });

  const solo = race.racers.size === 1;

  $('rmeta').innerHTML = [solo ? null : fmt(t), medal, isBest ? 'New best' : 'Best ' + fmt(best.time)].filter(Boolean).join(' &nbsp;·&nbsp; ');
  $('rstand').style.display = solo ? 'none' : '';
  drawStandings();

  opts.route = nextRoute(route.id); store.set('route', opts.route);   // menu's Race moves on to the next route

  $('rstand').innerHTML = race.standings().map((x, i) => `<div class="${x.player ? 'me' : ''}"><span>${i + 1}</span><span>${x.name}</span><span>${x.finished ? fmt(x.time) : '—'}</span></div>`).join('');

// ---------------------------------------------------------------- HUD

  $('pos').innerHTML = r.place + '<small>/' + race.racers.size + '</small>';

// ---------------------------------------------------------------- input: keyboard
addEventListener('keydown', (e) => {
  const c = e.code;
  if (c === 'KeyF' && !e.repeat) { rez.show = !rez.show; $('fps').style.display = rez.show ? '' : 'none'; }
  if (state === 'race') {
    keys.add(c);
    if (c === 'KeyC' && !e.repeat) camMode = (camMode + 1) % 3;
    if (c === 'KeyR' && !e.repeat) respawn(player);
    if (c === 'Escape' || c === 'KeyP') pause();
    if (c.startsWith('Arrow') || c === 'Space') e.preventDefault();
    return;
  }
  if (!ui || !['menu', 'paused', 'results'].includes(state)) return;
  if (c === 'ArrowUp' || c === 'KeyW') move(-1);
  else if (c === 'ArrowDown' || c === 'KeyS') move(1);
  else if (c === 'ArrowLeft' || c === 'KeyA') change(-1);
  else if (c === 'ArrowRight' || c === 'KeyD') change(1);
  else if (c === 'Enter' || c === 'Space') { if (!e.repeat) confirm(); }
  else if (c === 'Escape' || c === 'Backspace') back();
  else return;
  e.preventDefault();
});
addEventListener('keyup', (e) => keys.delete(e.code));
addEventListener('blur', () => { keys.clear(); if (state === 'race') pause(); });

// ---------------------------------------------------------------- input: gamepad (A ok · B back · Start pause · Y reset · X camera)

  if (state === 'race') {
    if (edge(9)) pause();
    if (edge(3)) respawn(player);
    if (edge(2)) camMode = (camMode + 1) % 3;
  } else if (ui && ['menu', 'paused', 'results'].includes(state)) {
    if (edge(0)) confirm();
    else if (edge(1)) back();
    else if (edge(9)) state === 'menu' ? confirm() : back();
    const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
    const dir = b(12) || ay < -0.5 ? 'u' : b(13) || ay > 0.5 ? 'd' : b(14) || ax < -0.5 ? 'l' : b(15) || ax > 0.5 ? 'r' : '';
    const act = (d) => (d === 'u' ? move(-1) : d === 'd' ? move(1) : d === 'l' ? change(-1) : d === 'r' ? change(1) : 0);
    if (dir !== pad.dir) { pad.dir = dir; pad.rep = 0.4; act(dir); }
    else if (dir && (pad.rep -= dt) <= 0) { pad.rep = 0.14; act(dir); }

}

  let st = (keys.has('KeyA') || keys.has('ArrowLeft') ? 1 : 0) - (keys.has('KeyD') || keys.has('ArrowRight') ? 1 : 0);
  const gp = navigator.getGamepads?.()[0];
  if (gp) {
    const ax = gp.axes[0] || 0; if (Math.abs(ax) > 0.12) st = -ax;
    th = Math.max(th, gp.buttons[7]?.value || 0); br = Math.max(br, gp.buttons[6]?.value || 0);

  const you = race.racers.get('you');

function setRez(v) { rez.cur = v; renderer.setPixelRatio(v); composer.setPixelRatio(v); }
setRez(params.has('capture') ? 1 : native);
function adaptResolution(raw) {
  rez.sum += Math.min(raw, 0.25); rez.n++;
  if (rez.sum < 1) return;
  const fps = rez.n / rez.sum; rez.sum = 0; rez.n = 0;
  if (rez.show) $('fps').textContent = Math.round(fps) + ' fps · ' + Math.round(rez.cur / native * 100) + '% · ' + gpu.short + ' · ' + quality + ' · L' + perf.level;
  if (params.has('capture') || document.hidden) return;
  let next = rez.cur;
  // after easing down, wait 12 s of clean frames before trying higher again, so it settles instead of see-sawing
  if (fps < 55) { next = Math.max(rez.min, rez.cur * (fps < 40 ? 0.85 : 0.93)); rez.good = -9; }
  else if (fps > 58 && ++rez.good >= 3) { next = Math.min(rez.max, rez.cur * 1.08); rez.good = 0; }   // 3 s of headroom before stepping up
  else if (fps <= 58) rez.good = Math.min(rez.good, 0);
  if (Math.abs(next - rez.cur) > 0.01) setRez(next);
  // still slow at the lowest render scale: shed one effect every 2 s until it keeps up
  if (fps < 45 && rez.cur <= rez.min + 0.01 && perf.level < PERF_MAX) {
    if (++perf.slow >= 2) { setPerfLevel(perf.level + 1); store.set(perfKey, perf.level); perf.slow = 0; }
  } else perf.slow = 0;
}

// ---------------------------------------------------------------- frame rate: effect ladder
// L0 everything · L1 no bloom · L2 no MSAA · L3 half-res sun shadows · L4 render scale may drop to 50 %.
// The level reached is remembered per GPU (localStorage mx.perf.<gpu>) so the next visit starts there;
// ?perf=0 resets it.
const PERF_MAX = 4, perfKey = 'perf.' + gpu.short, perf = { level: 0, slow: 0 };
function setPerfLevel(l) {
  perf.level = l;
  bloom.enabled = l < 1;
  const samples = l >= 2 ? 0 : 4;
  for (const rt of [composer.renderTarget1, composer.renderTarget2]) if (rt.samples !== samples) { rt.samples = samples; rt.dispose(); }
  const sm = (quality === 'ultra' ? 4096 : 2048) / (l >= 3 ? 2 : 1), sh = map.sun.shadow;
  if (sh.mapSize.x !== sm) { sh.mapSize.set(sm, sm); if (sh.map) { sh.map.dispose(); sh.map = null; } }
  rez.min = native * (l >= 4 ? 0.5 : 0.7);
}
setPerfLevel(Math.max(0, Math.min(PERF_MAX, params.has('perf') ? +params.get('perf') || 0 : +store.get(perfKey) || 0)));
if (params.has('perf')) store.set(perfKey, perf.level);

function loop() {
  // dt is capped at 0.1 s: below 10 fps the game slows down rather than tunnelling through the ground
  const now = performance.now(), raw = (now - lastTime) / 1000, dt = Math.min(0.1, raw); lastTime = now;
  frame(dt);
  render();
  adaptResolution(raw);
  requestAnimationFrame(loop);
}

// ---------------------------------------------------------------- GPU notice (menu + pause)
if (!gpu.discrete) {
  const el = document.createElement('div'); el.id = 'gpu';
  el.innerHTML = gpu.software
    ? `<b>Graphics acceleration is off</b>Chrome is drawing MX without the GPU. Chrome › Settings › System › turn on “Use graphics acceleration when available”, then Relaunch.`
    : `<b>Running on ${gpu.short}</b>That's the laptop's built-in graphics chip, not its gaming GPU. Windows Settings › System › Display › Graphics › Google Chrome › Options › High performance (NVIDIA), then close and reopen Chrome.`;
  document.body.append(el);
}

// ---------------------------------------------------------------- boot
window.__mx = { THREE, scene, camera, renderer, composer, render, gpu, quality, rez, map, terrain, world, tracks, bikeTracks, windSand, sand, get state() { return state; }, get race() { return race; }, get racers() { return racers; }, startRace, toMenu, frame, SprintRace, opts };
(async () => {
  const sp = new SprintRace(terrain, opts.route).gridSlots(1)[0];
  await map.init(sp.x, sp.z, (p) => { $('lbar').style.width = (p * 100).toFixed(0) + '%'; });
  camera.position.set(sp.x - 20, terrain.height(sp.x, sp.z) + 12, sp.z - 20); camera.lookAt(sp.x, 0, sp.z);
  await precompile(scene);   // build every shader now, behind the loading screen, not as a stutter on the first frames
  $('loading').classList.add('off');
  if (!params.has('manual')) loop();
  if (params.has('roam')) startRoam();                                  // ?roam jumps straight into free drive
  else if (params.has('route') && !params.has('menu')) startRace();   // ?route=… jumps straight into a race
  else { openMenu(); await stage(); }
})();
</script>
